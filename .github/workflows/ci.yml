name: Python tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test web application
        working-directory: web
        run: |
          npm ci
          npm run test
          npm run build
      - name: Install package and test dependencies
        run: python -m pip install -c requirements.lock -e ".[dev]"
      - name: Run pytest
        run: python -m pytest
