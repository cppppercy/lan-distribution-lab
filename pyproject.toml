[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-distribution-lab"
version = "0.1.0"
description = "Minimal service baseline for the LAN Distribution Lab course project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
